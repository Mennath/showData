<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUDS</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="container">

        <!-- Title -->
        <h1>CRUDS</h1>
        <div class="crud-title">
            CREATE &nbsp; READ &nbsp; UPDATE &nbsp; DELETE &nbsp; SEARCH
        </div>

        <!-- Inputs -->
        <input type="text" id="title" class="form-control" placeholder="Title">

        <div class="row">
            <div class="col-md">
                <input type="number" id="price" class="form-control" placeholder="Price" onkeyup="getTotal()">
            </div>

            <div class="col-md">
                <input type="number" id="taxes" class="form-control" placeholder="Taxes" onkeyup="getTotal()">
            </div>

            <div class="col-md">
                <input type="number" id="ads" class="form-control" placeholder="Ads" onkeyup="getTotal()">
            </div>

            <div class="col-md">
                <input type="number" id="discount" class="form-control" placeholder="Discount" onkeyup="getTotal()">
            </div>

            <div class="col-md">
                <input type="text" id="total" class="form-control" placeholder="Total" readonly>
            </div>
        </div>

        <input type="number" id="count" class="form-control" placeholder="Count">

        <input type="text" id="category" menna: class="form-control" placeholder="Category">

        <!-- Create / Update -->
        <button id="submitBtn" class="btn btn-purple w-100 mb-3" onclick="createProduct()">
            Create
        </button>

        <!-- Search -->
        <input type="text" id="search" class="form-control" placeholder="Search" onkeyup="searchData(this.value)">

        <div class="row">
            <div class="col-md-6">
                <button class="btn btn-purple w-100 mb-2" onclick="setSearchMode('title')">
                    Search By Title
                </button>
            </div>

            <div class="col-md-6">
                <button class="btn btn-purple w-100 mb-2" onclick="setSearchMode('category')">
                    Search By Category
                </button>
            </div>
        </div>

        <button class="btn btn-purple w-100 delete-all" onclick="deleteAll()">
            Delete All 
        </button>

        <!-- Table -->
        <div class="table-responsive">
            <table class="table text-center">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>TITLE</th>
                        <th>PRICE</th>
                        <th>TAXES</th>
                        <th>ADS</th>
                        <th>DISCOUNT</th>
                        <th>TOTAL</th>
                        <th>CATEGORY</th>
                        <th >UPDATE</th>
                        <th>DELETE</th>
                    </tr>
                </thead>

                <tbody id="tableBody"></tbody>
            </table>
        </div>

    </div>


    <script src="./js/script.js"> </script>

</body>

</html>
